<!doctype html>
<html lang="ko" data-os="__TM_OS__">
<head>
<meta charset="utf-8">
<meta name="tm-token" content="__TM_TOKEN__">
<title>LazyScheduler</title>
<link rel="icon" href="icon-32.png">
<link rel="preload" href="fonts/paperlogy-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ══════════ 머리 (56) ══════════
     먹 띠 하나에 구역 넷: 지금(시각 · 날짜) | 화면 넘기기(오늘 · 달력 · 전체, 창 가운데) | 할 일(새 항목 · 설정) | 창 단추.
     (작은 새 항목 창에서는 문장 칸이 머리를 통째로 쓴다)
     머리 전체가 창의 제목줄이다 (끌어서 옮기기 · 두 번 눌러 최대화). 문장 칸은 늘 여기 있다 -
     아무 글자나 치면 이리로 들어온다. 친 말 중 날짜 · 시각 · 반복으로 읽힌 말은 청록으로 칠해지고,
     오른쪽에 무엇이 만들어질지(FRI 30 OCT 15:00)가 선다. -->
<header class="head" id="titlebar">
  <div class="clk" aria-label="지금 시각"><b id="clock">--:--</b><span id="date">—</span></div>
  <div class="field" id="field">
    <button class="plus" id="plus" type="button" title="새 항목 · Ctrl N" aria-label="새 항목 · Ctrl N"><i></i><i></i><span>새 항목</span></button>
    <div class="fbox"><div class="fhl" id="fhl" aria-hidden="true"></div>
      <input id="say" autocomplete="off" spellcheck="false" aria-label="새 항목 - 이름과 언제를 한 줄로 (예: 보고서 금요일 3시)"></div>
    <span class="fsum" id="fsum" aria-live="polite"></span>
    <button class="fx" id="f-more" type="button" title="날짜 · 반복 · 알림을 자세히" hidden>자세히</button>
    <button class="fx bad" id="f-del" type="button" hidden>삭제</button>
  </div>
  <nav class="tabs" id="tabs" aria-label="화면">
    <button type="button" data-v="today"><span class="tn" data-t="오늘">오늘</span></button>
    <button type="button" data-v="cal"><span class="tn" data-t="달력">달력</span></button>
    <button type="button" data-v="all"><span class="tn" data-t="전체">전체</span></button>
  </nav>
  <button type="button" class="tab-set" data-v="set" title="설정" aria-label="설정"><svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"><path d="M13.22 6.27L15.06 6.57L15.06 9.43L13.22 9.73L12.92 10.47L14.00 11.98L11.98 14.00L10.47 12.92L9.73 13.22L9.43 15.06L6.57 15.06L6.27 13.22L5.53 12.92L4.02 14.00L2.00 11.98L3.08 10.47L2.78 9.73L0.94 9.43L0.94 6.57L2.78 6.27L3.08 5.53L2.00 4.02L4.02 2.00L5.53 3.08L6.27 2.78L6.57 0.94L9.43 0.94L9.73 2.78L10.47 3.08L11.98 2.00L14.00 4.02L12.92 5.53Z"/><circle cx="8" cy="8" r="2.2"/></svg></button>
  <i class="tabline" id="tabline" aria-hidden="true"></i>
  <div class="wins">
    <button class="wbtn" id="w-min" title="최소화" aria-label="최소화"><i class="w-min"></i></button>
    <button class="wbtn" id="w-max" title="최대화" aria-label="최대화"></button>
    <button class="wbtn close" id="w-close" title="닫기 (알림은 계속 동작)" aria-label="닫기"><i class="w-x"></i><i class="w-x"></i></button>
  </div>
</header>

<!-- 줄에 마우스를 올리면 머리 아래로 내려오는 읽기 띠: 그 일의 날짜 · 시각 · 반복 · 알림 · 상태 -->
<div class="rop" id="rop" role="menu"></div>

<!-- 연결 끊김 · 데이터 복구 같은 알림 띠. 평소에는 숨어 있다 (app.js 의 strip) -->
<div class="strip" id="strip" hidden>
  <span class="s-msg" id="strip-msg"></span>
  <button class="s-btn" id="strip-btn" hidden></button>
</div>

<main class="main" id="main">

  <!-- ══════════ 오늘 ══════════
       왼쪽 위: Today - 다음 일이 렌즈 위에 서고, 지나온 일은 위로 · 남은 일은 아래로.
       왼쪽 아래: Anytime - 시각 없는 일 (오늘 할 일 + 날짜 없는 메모, 2026-11 Notes 를 합쳤다). 높이는 그 위 틈을 끌어 바꾼다.
       오른쪽: Upcoming - 내일부터 네 주, 스크롤. 날을 누르면 그날 전체. -->
  <section class="v v-today" id="v-today">
    <div class="pane L" data-drop="0">
      <div class="card"><div class="ph"><span class="pt">Today</span><span class="pc" id="c-today"></span><span class="pn" id="t-late"></span><i class="prog" id="t-prog" aria-hidden="true"></i></div>
      <div class="drum" id="drum"></div></div>
      <div class="shelf" id="any" data-drop="0"><div class="ph"><span class="pt">Anytime</span><span class="pc" id="c-any"></span></div><div class="slist" id="any-list"></div></div>
    </div>
    <div class="pane R">
      <div class="card"><div class="ph"><span class="pt">Upcoming</span></div>
      <div class="up" id="up"></div></div>
    </div>
    <div class="seam-h" id="seam" title="끌어서 선반 높이 조절 · 두 번 누르면 처음대로"></div>
  </section>

  <!-- ══════════ 달력 ══════════ -->
  <section class="v v-cal" id="v-cal" hidden>
    <div class="calh">
      <b class="cal-ym" id="cal-ym">—</b>
      <button class="sq" id="cal-prev" type="button" title="이전 달 · ←" aria-label="이전 달">‹</button>
      <button class="sq" id="cal-next" type="button" title="다음 달 · →" aria-label="다음 달">›</button>
      <button class="lnk" id="cal-now" type="button">이번 달</button>
    </div>
    <div class="calw" id="cal-head"></div>
    <div class="calg" id="cal-grid"></div>
  </section>

  <!-- ══════════ 전체 ══════════ 왼쪽은 모든 항목, 오른쪽은 고른 하나의 자세한 값 -->
  <section class="v v-all" id="v-all" hidden>
    <div class="pane L scroll" id="all-list"></div>
    <div class="pane R" id="insp"></div>
  </section>

  <!-- ══════════ 설정 ══════════ 바꾸는 즉시 저장한다. 왼쪽은 일정 · 알림, 오른쪽은 프로그램 -->
  <section class="v v-set" id="v-set" hidden>
    <div class="pane L">
      <div class="gh"><span>Alerts</span></div>
      <div class="srow"><div class="sl"><b>기본 알림</b></div><div class="seg" id="s-lead"></div></div>
      <div class="srow"><div class="sl"><b>아침 브리핑</b></div><div class="seg" id="s-brief"></div></div>
      <div class="srow" title="전체 화면 · 발표 모드 · 방해 금지 · 잠금 화면일 때 미룹니다.&#10;창을 띄워 둔 채 하는 화면 공유는 Windows 가 알려주지 않아 잡지 못합니다."><div class="sl"><b>발표 중</b></div><div class="seg" id="s-hold"></div></div>
      <div class="gh"><span>Schedule</span></div>
      <div class="srow"><div class="sl"><b>영업일 기준</b><span id="s-biz-d"></span></div><div class="seg" id="s-biz"></div></div>
      <div class="srow"><div class="sl"><b>하루 끝</b></div><div class="seg" id="s-end"></div></div>
      <div class="sfoot">
        <button class="lnk" id="s-test" type="button">알림 미리보기</button>
        <button class="lnk" id="s-shortcut" type="button">바탕화면 바로가기</button>
        <span class="sp"></span>
        <span class="where" id="s-where" title="일정 파일이 있는 곳">%APPDATA%\LazyScheduler</span>
      </div>
    </div>
    <div class="pane R">
      <div class="gh"><span>App</span></div>
      <div class="srow"><div class="sl"><b>화면 모드</b></div><div class="seg" id="s-theme"></div></div>
      <div class="srow"><div class="sl"><b>시작할 때 실행</b><span id="s-auto-d"></span></div><div class="seg" id="s-auto"></div></div>
      <div class="srow"><div class="sl"><b>자동 업데이트</b></div><div class="seg" id="s-upd"></div></div>
      <div class="srow"><div class="sl"><b>어디서든 새 항목</b><span id="s-hot-d"></span></div><div class="seg" id="s-hot"></div></div>
      <div class="gh"><span>Sync</span></div>
      <div class="srow"><div class="sl"><b>Google 계정</b><span id="sync-msg" aria-live="polite">—</span></div>
        <div class="sbtns"><button class="btn" id="sync-now" type="button" hidden>지금 맞추기</button><button class="btn" id="sync-btn" type="button">로그인</button></div></div>
      <div class="sfoot">
        <span class="ver" id="s-ver">v—</span><span id="s-vst"></span>
        <button class="lnk" id="s-upd-btn" type="button">업데이트 확인</button>
        <button class="lnk bad" id="s-quit" type="button">앱 종료</button>
        <span class="sp"></span>
        <button class="lnk bad" id="sync-del" type="button" hidden>계정 삭제</button>
        <button class="btn" id="s-close" type="button">닫기</button>
      </div>
    </div>
  </section>

  <!-- ── 자세히 (새 항목 · 고치기): 머리 아래를 통째로 덮는 종이. 날짜 · 반복 · 알림을 손으로 ── -->
  <div class="modal sheet form" id="m-add" role="dialog" aria-modal="true" aria-label="새 항목">
    <div class="f-head"><span class="f-kind">New</span><button class="x" type="button" data-close title="닫기 · Esc" aria-label="닫기"><i></i><i></i></button></div>
    <div class="cp"></div>
    <div class="f-foot"><p class="rcpt" aria-live="polite"></p>
      <div class="btns"><button class="ghost" data-close>취소</button><button id="a-save" class="f-save" title="Enter · Ctrl+Enter">추가</button></div></div>
  </div>
  <div class="modal sheet form" id="m-edit" role="dialog" aria-modal="true" aria-label="항목 고치기">
    <div class="f-head"><span class="f-kind">Edit</span>
      <div class="f-acts"><button type="button" id="e-later">내일로</button><button type="button" id="e-skip">이번 회차 건너뛰기</button><button type="button" class="bad" id="e-del">삭제</button></div>
      <button class="x" type="button" data-close title="닫기 · Esc" aria-label="닫기"><i></i><i></i></button></div>
    <div class="cp"></div>
    <div class="f-foot"><p class="rcpt" aria-live="polite"></p>
      <div class="btns"><button class="ghost" data-close>취소</button><button id="e-save" class="f-save" title="Enter · Ctrl+Enter">저장</button></div></div>
  </div>
</main>

<!-- 되돌리기 · 알림말. 아래 가운데 한 자리 -->
<div class="undo" id="undo" role="status" aria-live="polite">
  <span class="u-v" id="undo-verb"></span>
  <b class="u-msg" id="undo-msg"></b>
  <button type="button" class="u-btn" id="undo-btn">되돌리기</button>
  <i class="u-s" id="undo-sec"></i>
</div>

<!-- 목록 줄에서 오른쪽 단추를 눌렀을 때 -->
<div class="ctx" id="ctx" role="menu"></div>
<div class="fpop" id="fpop" aria-live="polite"></div>

<!-- 시각 고르기 (자세히 종이의 시각 칸) -->
<div class="tp" id="tp" role="dialog" aria-label="시각 고르기"></div>

<div class="veil" id="veil"></div>

<!-- ── 하루 전체 (달력의 +n) ── -->
<div class="modal" id="m-day" role="dialog" aria-modal="true" aria-labelledby="day-title">
  <h3 id="day-title">—</h3>
  <div class="mg-list" id="day-list"></div>
  <div class="btns split">
    <div><button class="ghost" id="day-add">이 날에 추가</button></div>
    <div><button class="ghost" data-close>닫기</button></div>
  </div>
</div>

<!-- ── 단축키 한 장 (?) ── -->
<div class="modal" id="m-keys" role="dialog" aria-modal="true" aria-labelledby="keys-title">
  <h3 id="keys-title">단축키</h3>
  <div class="keys" id="keys-list"></div>
  <div class="btns"><button class="ghost" data-close>닫기</button></div>
</div>

<!-- ── 확인 ── -->
<div class="modal narrow" id="m-confirm" role="alertdialog" aria-modal="true" aria-labelledby="cf-title">
  <h3 id="cf-title">확인</h3>
  <p class="hint" id="cf-msg"></p>
  <div id="cf-extra"></div>
  <div class="btns"><button class="ghost" data-close>취소</button><button class="danger-solid" id="cf-ok">삭제</button></div>
</div>

<!-- ── 새 버전으로 바꾼 뒤 처음 여는 창에 한 번 (updater.py) ── -->
<div class="modal narrow" id="m-update" role="dialog" aria-modal="true" aria-labelledby="up-title">
  <h3 id="up-title">새 버전으로 바꿨습니다</h3>
  <p class="hint" id="up-ver"></p>
  <ul class="up-notes" id="up-notes"></ul>
  <div class="btns"><button id="up-ok">확인</button></div>
</div>

<script src="when.js"></script>
<script src="app.js"></script>
<script src="sky.js"></script>
</body>
</html>
