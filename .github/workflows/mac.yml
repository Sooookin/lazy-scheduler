# macOS 빌드 확인: mac 브랜치에 올리거나 [Run workflow] 로 손으로 돌린다. 릴리스는 하지 않는다.
#
#   테스트 → LazyScheduler.app 빌드 → 빌드본을 실제로 켜 보기(tools/smoke.py: 창 · 알림 카드 · 종료)
#
# Mac 이 없어도 macOS 빌드가 되는지, 켜지는지 여기서 본다. 결과 요약은 작업의 annotation 으로
# (로그인 없이 읽힌다), zip · 찍은 화면 · app.log 는 Artifacts 로 남긴다.
name: mac

on:
  push:
    branches: [mac]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 패키지
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/requirements-build-mac.txt pytest pytest-github-actions-annotate-failures

      # 처음 몇 번은 테스트가 깨져도 빌드 · 켜 보기까지 가서 한 번에 다 본다
      - name: 테스트
        continue-on-error: true
        run: python -m pytest -q -p no:cacheprovider

      - name: 동기화 설정
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
        run: |
          if [ -n "$FIREBASE_CONFIG" ]; then printf '%s' "$FIREBASE_CONFIG" > firebase/config.local.json; fi

      - name: 빌드
        run: |
          set -o pipefail
          python tools/build.py 2>&1 | tee build.log || {
            python -c "import sys; t=open('build.log',encoding='utf-8',errors='replace').read()[-3500:]; print('::error title=build::'+t.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))"
            exit 1; }

      - name: 켜 보기 (빌드본)
        run: python tools/smoke.py --exe release/mac/LazyScheduler.app/Contents/MacOS/LazyScheduler --out smoke

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LazyScheduler-mac
          path: |
            release/LazyScheduler-mac.zip
            smoke/
            build.log
          if-no-files-found: ignore
