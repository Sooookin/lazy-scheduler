    /* ── A′ 공통: 점토 바탕 · 따뜻한 회갈 글자 · 모조지 80% ─────────────────
       색 · 결 · 움직임 값은 모든 보드에서 같다. 한 보드에서만 바꾸지 않는다. */
    :root{
      --bg:#e9e4dd; --card:#e9e4dd; --dark:#c2b9ac; --light:#fdfaf5; --pale:#dbd4c9;
      --wash:radial-gradient(130% 130% at 12% 6%, #efebe4 0%, #e9e4dd 45%, #e3ded6 100%);
      --rule:rgba(56,46,32,.085); --rule2:rgba(56,46,32,.17);
      --ink2:#2b2620; --body:#3a332b; --muted:#453d33; --faint:#5c5346;
      --mint:#85bdb3; --mid:#4d7572; --deep:#08202b; --onmid:#eef3f1; --midshadow:rgba(77,117,114,.30);
      --mid-ink:#466a68;            /* 청록을 글자로 쓸 때: 4.7:1 (장식용 #4d7572 는 4.0:1) */
      --rowpad:9px;
      --k:1.143;                      /* 종이 결 세기 80% (70% = 1) */
      /* 움직임: 자리 이동은 transform · opacity 로만, 레이아웃 속성은 움직이지 않는다. 곡선 하나, 시간 세 단계 */
      --ease:cubic-bezier(.2,.8,.2,1); --t-fast:140ms; --t-med:220ms; --t-slow:320ms;
    }
    @media (prefers-reduced-motion: reduce){
      *, *::before, *::after{animation-duration:.01ms !important; animation-delay:0ms !important;
        animation-iteration-count:1 !important; transition-duration:.01ms !important}
    }
    /* 모조지 결 — 칸과 글자 위에 곱하기로 얹는다. SVG 필터라 어떤 배율에서도 흐려지지 않는다 */
    .grain{position:absolute; inset:0; z-index:2; pointer-events:none; mix-blend-mode:multiply}
    .grain i{position:absolute; inset:0}
    .grain i:nth-child(1){background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20width%3D'240'%20height%3D'240'%3E%3Cfilter%20id%3D't'%3E%3CfeTurbulence%20type%3D'fractalNoise'%20baseFrequency%3D'0.85'%20numOctaves%3D'2'%20stitchTiles%3D'stitch'%2F%3E%3CfeDiffuseLighting%20surfaceScale%3D'0.9'%20lighting-color%3D'%23fffaf2'%3E%3CfeDistantLight%20azimuth%3D'235'%20elevation%3D'62'%2F%3E%3C%2FfeDiffuseLighting%3E%3C%2Ffilter%3E%3Crect%20width%3D'240'%20height%3D'240'%20filter%3D'url(%23t)'%2F%3E%3C%2Fsvg%3E"); background-size:240px 240px; opacity:calc(.62 * var(--k))}
    .grain i:nth-child(2){background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20width%3D'560'%20height%3D'560'%3E%3Cfilter%20id%3D'c'%3E%3CfeTurbulence%20type%3D'fractalNoise'%20baseFrequency%3D'0.012'%20numOctaves%3D'4'%20seed%3D'3'%20stitchTiles%3D'stitch'%2F%3E%3CfeColorMatrix%20type%3D'matrix'%20values%3D'0.30%200.59%200.11%200%200.03%20%200.30%200.59%200.11%200%200.01%20%200.30%200.59%200.11%200%20-0.03%20%200%200%200%201%200'%2F%3E%3C%2Ffilter%3E%3Crect%20width%3D'560'%20height%3D'560'%20filter%3D'url(%23c)'%20opacity%3D'0.55'%2F%3E%3C%2Fsvg%3E"); background-size:560px 560px; opacity:calc(.40 * var(--k))}
    .grain i:nth-child(3){background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20width%3D'180'%20height%3D'180'%3E%3Cfilter%20id%3D'f'%3E%3CfeTurbulence%20type%3D'fractalNoise'%20baseFrequency%3D'0.9'%20numOctaves%3D'3'%20stitchTiles%3D'stitch'%2F%3E%3CfeColorMatrix%20type%3D'matrix'%20values%3D'0.30%200.59%200.11%200%200.03%20%200.30%200.59%200.11%200%200.01%20%200.30%200.59%200.11%200%20-0.03%20%200%200%200%201%200'%2F%3E%3C%2Ffilter%3E%3Crect%20width%3D'180'%20height%3D'180'%20filter%3D'url(%23f)'%2F%3E%3C%2Fsvg%3E"); background-size:180px 180px; opacity:calc(.12 * var(--k))}
    /* 달력 — 점토 바탕 · 모조지 80% · Paperlogy 두 종.
       넓은 화면에서 칸이 330px 까지 벌어지므로 칩을 키워 "시각 + 제목" 이 나란히 읽히게 한다.
       깊이는 담는 것(칸 · 버튼)에만, 읽는 것(칩)은 평평하게. */
    *{box-sizing:border-box}
    body{margin:0; height:860px; overflow:hidden}
    a{color:var(--mid-ink)} a:hover{color:var(--ink2)}
    .page{position:relative; height:100%; color:var(--body); background:var(--bg); background-image:var(--wash);
      font-family:"Paperlogy","Malgun Gothic",sans-serif; font-size:13px; font-weight:500; letter-spacing:-.2px;
      -webkit-font-smoothing:antialiased; font-feature-settings:"tnum" 1}
    .wrap{position:relative; height:100%; padding:20px 24px 16px; display:flex; flex-direction:column; gap:14px}
    .shell{flex:1; min-height:0; background:var(--card); border-radius:18px; padding:16px 18px 14px;
      display:flex; flex-direction:column; gap:12px;
      box-shadow:4px 4px 10px var(--dark), -4px -4px 10px var(--light)}
    .bar{display:flex; align-items:center; gap:8px; flex:0 0 auto}
    .nav{width:30px; height:30px; border:0; border-radius:9px; cursor:pointer; background:var(--card);
      color:var(--muted); display:grid; place-items:center;
      box-shadow:2px 2px 6px var(--dark), -2px -2px 6px var(--light);
      transition:box-shadow var(--t-fast) var(--ease), color var(--t-fast) var(--ease)}
    .nav:hover{color:var(--ink2)}
    .nav:active{box-shadow:inset 2px 2px 5px var(--dark), inset -2px -2px 5px var(--light)}
    /* 큰 글자는 가늘게 */
    .ym{font-size:17px; font-weight:300; color:var(--ink2); min-width:112px; text-align:center;
      letter-spacing:-.4px}
    .lnk{border:0; background:none; cursor:pointer; font-family:inherit; font-size:11px; font-weight:500;
      color:var(--faint); text-decoration:underline; text-decoration-color:var(--rule2);
      text-underline-offset:4px; padding:0 4px; transition:color var(--t-fast) var(--ease)}
    .lnk:hover{color:var(--ink2)}
    .chip-btn{border:0; cursor:pointer; font-family:inherit; font-size:11px; font-weight:500;
      color:var(--muted); background:var(--card); border-radius:9px; padding:7px 12px;
      box-shadow:2px 2px 6px var(--dark), -2px -2px 6px var(--light);
      transition:box-shadow var(--t-fast) var(--ease), color var(--t-fast) var(--ease)}
    .chip-btn:hover{color:var(--ink2)}
    .gap{flex:1}
    .legend{display:flex; align-items:center; gap:14px; font-size:10.5px; font-weight:300; color:var(--faint)}
    .legend span{display:flex; align-items:center; gap:6px}
    .legend i{width:9px; height:9px; border-radius:3px; display:block}
    .head{display:grid; grid-template-columns:repeat(5, minmax(0, 1fr)); gap:9px; flex:0 0 auto;
      padding-bottom:7px; border-bottom:1px solid var(--rule2)}
    .head span{text-align:center; font-size:10.5px; font-weight:500; color:var(--faint); letter-spacing:1.4px}
    .grid{flex:1; min-height:0; display:grid; grid-template-columns:repeat(5, minmax(0, 1fr));
      grid-auto-rows:1fr; gap:9px}
    .day{border-radius:12px; padding:8px 9px 7px; display:flex; flex-direction:column; gap:5px;
      overflow:hidden; min-height:0; cursor:pointer;
      box-shadow:inset 2px 2px 5px var(--dark), inset -2px -2px 5px var(--light);
      transition:box-shadow var(--t-fast) var(--ease)}
    .day:hover{box-shadow:inset 3px 3px 7px var(--dark), inset -3px -3px 7px var(--light)}
    .day .n{font-size:12px; font-weight:500; color:var(--ink2); display:flex; align-items:center;
      gap:6px; flex:0 0 auto}
    .day .hn{font-size:9.5px; font-weight:300; color:var(--faint)}
    .day.out{cursor:default;
      box-shadow:inset 1px 1px 3px rgba(194,185,172,.55), inset -1px -1px 3px rgba(253,250,245,.55)}
    .day.out .n{color:#8b8175}
    .day.hol{background:linear-gradient(160deg, rgba(219,212,201,.75), rgba(219,212,201,.25))}
    .day.hol .n{color:var(--faint)}
    /* 오늘 - 유일하게 올라온 칸 */
    .day.now{box-shadow:3px 3px 9px var(--dark), -3px -3px 9px var(--light)}
    .day.now .n .num{background:var(--deep); color:var(--onmid); border-radius:6px; padding:1px 6px}
    .chips{display:flex; flex-direction:column; gap:4px; min-height:0; overflow:hidden}
    /* 넓어진 칸을 쓴다: 24px 높이, 시각과 제목이 나란히 */
    .c{display:flex; align-items:center; gap:7px; border-radius:6px; padding:4px 8px;
      font-size:11px; line-height:1.35; white-space:nowrap; overflow:hidden;
      background:var(--pale); color:var(--ink2); border-left:3px solid var(--mint);
      transition:filter var(--t-fast) var(--ease)}
    .c:hover{filter:brightness(1.035)}
    .c .h{font-variant-numeric:tabular-nums; font-weight:500; opacity:.78; flex:0 0 auto; font-size:10.5px}
    .c .n2{overflow:hidden; text-overflow:ellipsis; font-weight:500}
    .c.past{background:var(--deep); color:var(--onmid)}
    .c.past .h{opacity:.65}
    .c.today{background:var(--mid); color:var(--onmid)}
    .c.done{background:transparent; color:var(--faint); border-left-color:var(--pale)}
    .c.done .n2{text-decoration:line-through}
    .more{font-size:10px; color:var(--mid-ink); font-weight:500; text-align:right; padding-right:2px;
      flex:0 0 auto}
  </style>
</helmet>

<div class="page">
  <div class="grain"><i></i><i></i><i></i></div>
  <div class="wrap">
    <div class="shell">
      <div class="bar">
        <button class="nav"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></button>

        </div>
      </div>

      <div class="head"><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span></div>

      <div class="grid">
        <sc-for list="{{days}}" as="d" hint-placeholder-count="25">
          <div class="day {{d.cls}}">
            <div class="n"><span class="num">{{d.numEl}}</span><span class="hn">{{d.hol}}</span></div>
            <div class="chips">
              <sc-for list="{{d.chips}}" as="c" hint-placeholder-count="2">
                <div class="c {{c.cls}}"><span class="h">{{c.h}}</span><span class="n2">{{c.t}}</span></div>
              </sc-for>
            </div>
            <sc-if value="{{d.more}}" hint-placeholder-val="{{ false }}">
              <div class="more">＋{{d.moreN}}건</div>
            </sc-if>
          </div>
        </sc-for>
      </div>
    </div>
  </div>
</div>
</x-dc>
