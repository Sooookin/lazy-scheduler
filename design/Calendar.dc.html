    /* 달력 — 방향 A 를 그대로 적용.
       넓은 화면에서 칸이 330px 까지 벌어지면 지금의 작은 칩은 허전해진다.
       칸이 넓어진 만큼 칩을 키워 "시각 + 제목" 이 편히 읽히게 한다. */
    :root{
      --bg:#e0e4df; --card:#e0e4df; --dark:#b7c0b7; --light:#f8faf5;
      --pale:#d2d8cf; --mint:#85bdb3; --mid:#4d7572; --ink2:#0b2c36; --deep:#08202b;
      --ink:#0b2c36; --body:#25383a; --muted:#2c4542; --faint:#425855; --deep-fg:#eef3f1;
      --rule2:rgba(28,44,34,.16);
      --serif:"Paperlogy","Malgun Gothic",sans-serif;
    }
    *{box-sizing:border-box}
    body{margin:0; color:var(--ink); background:var(--bg);
      font-family:"Paperlogy","Malgun Gothic",sans-serif;
      font-size:13px; font-weight:500; letter-spacing:-.2px; -webkit-font-smoothing:antialiased;
      font-feature-settings:"tnum" 1; height:860px; overflow:hidden}
    a{color:#3d6b67} a:hover{color:#0b2c36}
    .wrap{height:100%; padding:20px 24px 16px; display:flex; flex-direction:column; gap:14px}
    .shell{flex:1; min-height:0; background:var(--card); border-radius:18px; padding:16px 18px 14px;
      display:flex; flex-direction:column; gap:12px;
      box-shadow:4px 4px 10px var(--dark), -4px -4px 10px var(--light)}
    .bar{display:flex; align-items:center; gap:8px; flex:0 0 auto}
    .nav{width:28px; height:28px; border:0; border-radius:9px; cursor:pointer; background:var(--card);
      color:var(--muted); display:grid; place-items:center;
      box-shadow:2px 2px 6px var(--dark), -2px -2px 6px var(--light)}
    .ym{font-family:var(--serif); font-size:16px; font-weight:500; color:var(--ink2); min-width:104px; text-align:center;
      letter-spacing:-.3px}
    .lnk{border:0; background:none; cursor:pointer; font-family:inherit; font-size:11px;
      color:var(--faint); text-decoration:underline; text-underline-offset:3px; padding:0 4px}
    .chip-btn{border:0; cursor:pointer; font-family:inherit; font-size:11px; font-weight:500;
      color:var(--muted); background:var(--card); border-radius:9px; padding:6px 11px;
      box-shadow:2px 2px 6px var(--dark), -2px -2px 6px var(--light)}
    .gap{flex:1}
    .legend{display:flex; align-items:center; gap:13px; font-size:10.5px; color:var(--faint)}
    .legend i{width:8px; height:8px; border-radius:2px; display:inline-block; margin-right:5px;
      vertical-align:middle}
    .head{display:grid; grid-template-columns:repeat(5,1fr); gap:9px; flex:0 0 auto}
    .head{padding-bottom:7px; border-bottom:1px solid var(--rule2)}
    .head span{text-align:center; font-size:10.5px; font-weight:500; color:var(--faint);
      letter-spacing:1.4px}
    .grid{flex:1; min-height:0; display:grid; grid-template-columns:repeat(5,1fr);
      grid-auto-rows:1fr; gap:9px}
    .day{border-radius:12px; padding:8px 9px 7px; display:flex; flex-direction:column; gap:5px;
      overflow:hidden; min-height:0;
      box-shadow:inset 2px 2px 5px var(--dark), inset -2px -2px 5px var(--light)}
    .day .n{font-family:var(--serif); font-size:12px; font-weight:500; color:var(--ink2); display:flex; align-items:center;
      gap:6px; flex:0 0 auto}
    .day .hn{font-size:9.5px; font-weight:500; color:var(--faint)}
    .day.out{box-shadow:inset 1px 1px 3px rgba(179,192,190,.5), inset -1px -1px 3px rgba(246,249,248,.5)}
    .day.out .n{color:#9fb0ad}
    .day.hol{background:linear-gradient(160deg, rgba(199,208,207,.5), rgba(207,214,213,.2))}
    .day.hol .n{color:var(--faint)}
    /* 오늘 - 유일하게 올라온 칸 */
    .day.now{box-shadow:3px 3px 9px var(--dark), -3px -3px 9px var(--light)}
    .day.now .n .num{background:var(--deep); color:var(--deep-fg); border-radius:6px; padding:1px 6px}
    .chips{display:flex; flex-direction:column; gap:4px; min-height:0; overflow:hidden}
    /* 넓어진 칸을 쓴다: 24px 높이, 시각과 제목이 나란히 */
    .c{display:flex; align-items:center; gap:7px; border-radius:6px; padding:4px 8px;
      font-size:11px; line-height:1.35; white-space:nowrap; overflow:hidden;
      background:var(--pale); color:var(--ink2); border-left:3px solid var(--mint)}
    .c .h{font-family:var(--serif); font-variant-numeric:tabular-nums; font-weight:500; opacity:.75; flex:0 0 auto;
      font-size:10.5px}
    .c .n2{overflow:hidden; text-overflow:ellipsis; font-weight:500}
    .c.past{background:var(--deep); color:var(--deep-fg)}
    .c.past .h{opacity:.6}
    .c.today{background:var(--mid); color:#eef3f2}
    .c.done{background:transparent; color:var(--faint); border-left-color:var(--pale)}
    .c.done .n2{text-decoration:line-through}
    .c.wk{border-left-style:dashed}
    .more{font-size:10px; color:var(--faint); font-weight:500; text-align:right; padding-right:2px;
      flex:0 0 auto}
  </style>
</helmet>

<div class="wrap">
  <div class="shell">
    <div class="bar">
      <button class="nav"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 18l-6-6 6-6"></path></svg></button>
      <div class="ym">2026년 9월</div>
      <button class="nav"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M9 6l6 6-6 6"></path></svg></button>
      <button class="lnk">이번 달</button>
      <button class="chip-btn">주말</button>
      <div class="gap"></div>
      <div class="legend">
        <span><i style="background:#08202b"></i>지남</span>
        <span><i style="background:#4d7572"></i>오늘</span>
        <span><i style="background:#cfd6d5"></i>예정</span>
        <span><i style="background:transparent;box-shadow:inset 0 0 0 1.5px #cfd6d5"></i>완료</span>
      </div>
    </div>

    <div class="head"><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span></div>

    <div class="grid">
      <sc-for list="{{days}}" as="d" hint-placeholder-count="25">
        <div class="day {{d.cls}}">
          <div class="n"><span class="num">{{d.numEl}}</span><span class="hn">{{d.hol}}</span></div>
          <div class="chips">
            <sc-for list="{{d.chips}}" as="c" hint-placeholder-count="2">
              <div class="c {{c.cls}}"><span class="h">{{c.h}}</span><span class="n2">{{c.t}}</span></div>
            </sc-for>
          </div>
          <sc-if value="{{d.more}}" hint-placeholder-val="{{ false }}">
            <div class="more">＋{{d.moreN}}건</div>
          </sc-if>
        </div>
      </sc-for>
    </div>
  </div>
</div>
