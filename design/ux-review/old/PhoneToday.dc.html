<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
/*__FONTFACE__*/
/*__TOKENS__*/
/*__BASE__*/
    .ph{width:390px; height:844px; display:flex; flex-direction:column}
    .sb{height:44px; display:flex; align-items:center; justify-content:space-between; padding:0 22px; font-size:13px; color:var(--ink2)}
    .hd{padding:6px 20px 0; display:flex; align-items:flex-start}
    .hd .d{font-size:13px; color:var(--faint); font-weight:400}
    .hd h1{margin:2px 0 0; font-size:25px; font-weight:500; color:var(--ink2); letter-spacing:-.5px}
    .hd .sp{flex:1}
    .hd .ic{width:40px; height:40px; border-radius:50%; display:grid; place-items:center; color:var(--muted); font-size:17px}
    .prog{display:flex; align-items:center; gap:10px; padding:10px 20px 0; font-size:12.5px; color:var(--mid-ink)}
    .prog .bar{flex:1; height:5px; border-radius:3px; background:var(--pale); overflow:hidden}
    .prog .bar i{display:block; width:40%; height:100%; background:var(--mid)}
    .tabs{display:flex; gap:6px; padding:14px 16px 6px; overflow:hidden}
    .tabs span{height:34px; padding:0 14px; border-radius:17px; display:inline-flex; align-items:center; gap:6px;
      font-size:13px; color:var(--faint); background:var(--pale); white-space:nowrap}
    .tabs span b{font-weight:500; font-size:12px; color:var(--mid-ink)}
    .tabs span.on{background:var(--mid); color:var(--onmid)}
    .tabs span.on b{color:var(--mint)}
    .list{flex:1; padding:4px 12px 0; position:relative}
    .grp{font-size:12px; color:var(--faint); font-weight:400; padding:12px 10px 4px}
    .row{position:relative; display:flex; align-items:center; gap:14px; min-height:58px; padding:0 12px; font-size:15px; color:var(--body)}
    .row + .row{box-shadow:inset 0 1px 0 var(--rule)}
    .row .t{flex:1; min-width:0}
    .row .t small{display:block; font-size:12px; color:var(--faint); font-weight:400; margin-top:2px}
    .row .m{display:flex; align-items:center; gap:8px}
    .chk{width:24px; height:24px}
    .chk.done::after{left:8px; top:4.5px; width:6px; height:11px}
    .swipe{position:relative; height:58px; overflow:hidden; border-radius:12px; margin:2px 0}
    .swipe .under{position:absolute; inset:0; display:flex; justify-content:flex-end}
    .swipe .under span{width:84px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
      font-size:12px; color:var(--onmid)}
    .swipe .under .tm2{background:var(--mid)}
    .swipe .under .del{background:#9a3b2e}
    .swipe .row{position:absolute; inset:0; right:168px; background:var(--card); box-shadow:4px 0 10px rgba(43,38,32,.12)}
    .snack{position:absolute; left:12px; right:12px; bottom:92px; height:50px; border-radius:14px; background:var(--deep);
      color:var(--onmid); display:flex; align-items:center; padding:0 8px 0 16px; font-size:14px; gap:10px;
      box-shadow:0 10px 24px rgba(8,32,43,.3)}
    .snack .u{margin-left:auto; height:36px; padding:0 14px; border-radius:10px; display:inline-flex; align-items:center;
      color:var(--mint); font-size:14px}
    .dock{position:absolute; left:0; right:0; bottom:0; padding:10px 12px 24px; background:linear-gradient(to top, var(--bg) 70%, rgba(231,235,234,0))}
    .addbar{height:52px; border-radius:26px; display:flex; align-items:center; gap:12px; padding:0 8px 0 18px;
      background:var(--light); box-shadow:0 0 0 1.5px var(--mid), 0 6px 16px var(--midshadow); font-size:15px; color:var(--faint)}
    .addbar .plus{margin-left:auto; width:38px; height:38px; border-radius:50%; background:var(--mid); color:var(--onmid);
      display:grid; place-items:center; font-size:20px}
  </style>
</helmet>

<div class="paper ph">
  <div class="grain"></div>
  <div class="sb"><span>14:20</span><span>● ● ▮</span></div>
  <div class="hd">
    <div><div class="d">9월 18일 금요일</div><h1>오늘</h1></div>
    <div class="sp"></div>
    <div class="ic">⌕</div><div class="ic">⚙</div>
  </div>
  <div class="prog"><span class="bar"><i></i></span>5건 중 3건 남음</div>
  <div class="tabs">
    <span class="on">오늘 <b>3</b></span><span>다가오는 일 <b>2</b></span><span>반복 <b>6</b></span><span>메모 <b>2</b></span>
  </div>

  <div class="list">
    <div class="grp">지난 일</div>
    <div class="row"><span class="chk"></span><span class="t">리스크 한도 점검표 회신<small>어제 09:00 마감</small></span><span class="m"><span class="pill late">어제</span></span></div>
    <div class="grp">오늘</div>
    <div class="row"><span class="chk"></span><span class="t">교보생명 체크리스트<small>반복 · 매주 금요일</small></span><span class="m"><span class="pill soon">20분 뒤</span><span class="tm">14:40</span></span></div>
    <div class="swipe">
      <div class="under"><span class="tm2">→<br>내일로</span><span class="del">✕<br>삭제</span></div>
      <div class="row"><span class="chk"></span><span class="t">국내 일임 매매<small>반복 · 매 영업일</small></span><span class="m"><span class="tm">15:00</span></span></div>
    </div>
    <div class="row"><span class="chk done"></span><span class="t done-t">아침운용현황</span><span class="m"><span class="tm" style="color:var(--dim)">08:30</span></span></div>
    <div class="row"><span class="chk done"></span><span class="t done-t">팀장님 해외통합</span><span class="m"><span class="tm" style="color:var(--dim)">10:35</span></span></div>

    <span class="num pin" style="left:4px; top:78px">3</span>
    <span class="num pin" style="right:176px; top:200px">3</span>
    <span class="num pin" style="right:6px; top:-44px">9</span>
  </div>

  <div class="snack">‘아침운용현황’ 완료<span class="u">되돌리기</span><span class="num">1</span></div>
  <div class="dock">
    <div class="addbar">할 일 추가 · 예: 내일 3시 보고서<span class="plus">+</span></div>
    <span class="num pin" style="left:4px; top:4px">2</span>
    <span class="num pin" style="right:4px; top:4px">11</span>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals(){ return {}; }
}
</script>
</body>
</html>
