<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>LazyScheduler</title>
<link rel="icon" href="icon-32.png">
<link rel="preload" href="fonts/paperlogy-500.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/paperlogy-300.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="demo.css">
</head>
<body>

<div class="titlebar" id="titlebar">
  <b class="tb-name">LazyScheduler</b>
  <div class="tb-gap"></div>
  <button class="wbtn" id="w-min" title="최소화" aria-label="최소화">
    <svg width="10" height="10" viewBox="0 0 10 10"><path d="M1 5h8" stroke="currentColor" stroke-width="1.1"/></svg>
  </button>
  <button class="wbtn" id="w-max" title="최대화" aria-label="최대화"></button>
  <button class="wbtn close" id="w-close" title="닫기 (알림은 계속 동작)" aria-label="닫기">
    <svg width="10" height="10" viewBox="0 0 10 10"><path d="M1.5 1.5l7 7M8.5 1.5l-7 7" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/></svg>
  </button>
</div>

<div class="app">

  <!-- ══════════ 하늘 ══════════
       창 위쪽은 오늘 하루다. 궤도는 실제 해가 지나는 길이고, 구슬 하나가 일 하나다.
       시계 · 단추 · 게으름뱅이가 모두 땅(아래 판)의 윗변에 발을 붙인다.
       땅의 윗변이 곧 지평선이라, 따로 선을 긋지 않는다. -->
  <div class="sky" id="sky">
   <div class="sky-art" id="sky-art">
    <svg class="sky-svg" id="sky-svg" aria-hidden="true"></svg>

    <div class="clk">
      <div class="clk-d" id="dow">—</div>
      <div class="clk-c" id="clock">--:--</div>
    </div>

    <div class="acts">
      <span class="act">
        <button class="rb" id="btn-view" type="button" title="달력" aria-label="달력">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3">
            <rect x="1.8" y="3" width="12.4" height="11.2" rx="2"/><path d="M1.8 6.6h12.4M5.2 1.8v2.4M10.8 1.8v2.4"/>
          </svg>
        </button><i id="btn-view-l">달력</i>
      </span>
      <span class="act">
        <button class="rb fill" id="btn-add" type="button" title="새 항목" aria-label="새 항목">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button><i>새 항목</i>
      </span>
      <span class="act">
        <button class="rb" id="btn-settings" type="button" title="설정" aria-label="설정">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3">
            <circle cx="8" cy="8" r="2.6"/>
            <path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/>
          </svg>
        </button><i>설정</i>
      </span>
    </div>

    <!-- 돌멩이 (게으름뱅이). 행동은 pebble.js 가 정한다. 겹마다 하는 일이 하나다:
         guy 자리(이동) > lean 기울기 > sq 눌림 · 튐 · 숨 > roll 구르기(몸 · 눈 · 소품이 함께 돈다) -->
    <div class="guy" id="guy" aria-hidden="true">
      <div class="pb-lean"><div class="pb-sq"><div class="pb-roll">
        <div class="gy-b"></div>
        <div class="gy-e" data-s="round"><s><i></i></s><s><i></i></s></div>
        <div class="pb-prop"></div>
      </div></div></div>
      <div class="pb-fx"></div>
    </div>
    <!-- 빛. 하늘 전체(게으름뱅이까지)를 덮고, 시계 · 단추만 그 위에 뜬다 -->
    <div class="sky-lite" id="sky-lite" aria-hidden="true"></div>
   </div>
  </div>

  <!-- ══════════ 땅 ══════════ -->
  <div class="ground">
    <!-- 연결 끊김 · 데이터 복구 같은 알림 띠. 평소에는 숨어 있다 (app.js 의 strip) -->
    <div class="strip" id="strip" hidden>
      <span class="s-ico" aria-hidden="true">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 6v8"/><path d="M12 18.5v.01"/></svg>
      </span>
      <span class="s-msg" id="strip-msg"></span>
      <button class="s-btn" id="strip-btn" hidden></button>
    </div>
    <!-- 땅의 눈금 숫자. 하늘은 지평선에서 잘리므로 숫자는 땅 쪽 맨 윗줄에 둔다 (drawSky) -->
    <div class="ruler" id="sky-ruler" aria-hidden="true"></div>
    <main class="home" id="v-home">
      <section class="col">
        <h2>오늘 <span class="n" id="c-today">0</span><i class="note" id="today-note"></i></h2>
        <div class="list" id="today"></div>
      </section>
      <div class="vr"></div>
      <section class="col r">
        <h2>다가오는 마감 <span class="n" id="c-up">0</span><i class="note">7일</i></h2>
        <div class="list" id="upcoming"></div>
        <h2 class="mt">메모 <span class="n" id="c-float">0</span></h2>
        <div class="list" id="floating"></div>
      </section>
    </main>

    <section class="cal" id="v-cal" hidden>
      <div class="cal-top">
        <button class="cbtn" id="cal-prev" title="이전 달" aria-label="이전 달">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <b class="cal-ym" id="cal-ym">—</b>
        <button class="cbtn" id="cal-next" title="다음 달" aria-label="다음 달">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </button>
        <button class="link" id="cal-now">이번 달</button>
        <span class="seg tg">
          <button id="cal-we" title="주말 칸 표시 / 숨김">주말</button>
          <button id="cal-rt" title="루틴 표시 / 숨김">루틴</button>
        </span>
        <div class="cal-gap"></div>
        <span class="cal-legend">
          <span><i class="lg p"></i>지남</span>
          <span><i class="lg t"></i>오늘</span>
          <span><i class="lg f"></i>예정</span>
          <span><i class="lg rt"></i>루틴</span>
        </span>
        <button class="x" type="button" id="cal-close" title="오늘로 돌아가기" aria-label="오늘로 돌아가기">
          <svg width="11" height="11" viewBox="0 0 11 11" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M1.6 1.6l7.8 7.8M9.4 1.6l-7.8 7.8"/></svg>
        </button>
      </div>
      <div class="cal-head" id="cal-head"></div>
      <div class="cal-grid" id="cal-grid"></div>
    </section>

    <footer class="foot">
      <button class="link" id="btn-manage">전체 항목 관리</button>
      <span id="status"></span>
    </footer>
  </div>

</div>

<!-- 완료 · 삭제 · 건너뛰기 · 내일로 뒤 5초 동안 되돌릴 수 있다 -->
<div class="undo" id="undo" role="status" aria-live="polite">
  <span class="u-v" id="undo-verb"></span>
  <b class="u-msg" id="undo-msg"></b>
  <button type="button" class="u-btn" id="undo-btn">되돌리기<i class="u-s" id="undo-sec"></i></button>
</div>

<!-- 목록 줄에서 오른쪽 단추를 눌렀을 때 -->
<div class="ctx" id="ctx" role="menu"></div>

<!-- 달력 줄에 마우스를 올렸을 때. 줄에서 뻐낸 시각과 전체 제목이 여기서 나온다 -->
<div class="hov" id="hov" aria-hidden="true"></div>

<!-- 시각 고르기: 24시간을 한눈에 펼쳐 놓고 시 · 분을 한 번씩 -->
<div class="tp" id="tp" role="dialog" aria-label="시각 고르기"></div>

<div class="veil" id="veil"></div>

<!-- ── 하루 전체 (달력에서 날짜를 눌렀을 때) ── -->
<div class="modal" id="m-day" role="dialog" aria-modal="true" aria-labelledby="day-title">
  <h3 id="day-title">—</h3>
  <div class="mg-list" id="day-list"></div>
  <div class="btns split">
    <div><button class="ghost" id="day-add">이 날짜에 마감 추가</button></div>
    <div><button class="ghost" data-close>닫기</button></div>
  </div>
</div>

<!-- ── 새 항목 ── -->
<div class="modal sheet form" id="m-add" role="dialog" aria-modal="true" aria-label="새 항목">
  <div class="f-head">
    <h3 id="a-head">새 할 일</h3>
    <div class="tabs" id="add-tabs">
      <button data-k="deadline" class="on">할 일</button>
      <button data-k="routine">루틴</button>
      <button data-k="floating">메모</button>
    </div>
    <button class="x" type="button" data-close title="닫기" aria-label="닫기"><svg width="11" height="11" viewBox="0 0 11 11" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M1.6 1.6l7.8 7.8M9.4 1.6l-7.8 7.8"/></svg></button>
  </div>
  <div class="row">
    <div class="g14"><label for="a-title">이름</label><input id="a-title" autocomplete="off"></div>
    <div><label for="a-note">메모 <i class="opt">(선택)</i></label><textarea id="a-note" rows="1" autocomplete="off"></textarea></div>
  </div>
  <div id="a-body" class="f-body"></div>
  <div class="btns">
    <button class="ghost" data-close>취소</button>
    <button id="a-save">추가</button>
  </div>
</div>

<!-- ── 상세 / 수정 ── -->
<div class="modal sheet form" id="m-edit" role="dialog" aria-modal="true" aria-label="항목 수정">
  <div class="f-head"><h3>항목 수정</h3><button class="x" type="button" data-close title="닫기" aria-label="닫기"><svg width="11" height="11" viewBox="0 0 11 11" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M1.6 1.6l7.8 7.8M9.4 1.6l-7.8 7.8"/></svg></button></div>
  <div class="row">
    <div class="g14"><label for="e-title">이름</label><input id="e-title" autocomplete="off"></div>
    <div><label for="e-note">메모 <i class="opt">(선택)</i></label><textarea id="e-note" rows="1" autocomplete="off"></textarea></div>
  </div>
  <div id="e-body" class="f-body"></div>
  <div class="btns split">
    <div>
      <button class="ghost danger" id="e-del">삭제</button>
      <button class="ghost" id="e-skip">이번 회차 건너뛰기</button>
      <button class="ghost" id="e-later">내일로</button>
    </div>
    <div>
      <button class="ghost" data-close>취소</button>
      <button id="e-save">저장</button>
    </div>
  </div>
</div>

<!-- ── 전체 관리 ── -->
<div class="modal sheet" id="m-manage" role="dialog" aria-modal="true" aria-label="전체 항목">
  <div class="f-head">
    <h3>전체 항목</h3>
    <div class="tabs" id="mg-tabs">
      <button data-k="all" class="on">전체</button>
      <button data-k="deadline">할 일</button>
      <button data-k="routine">루틴</button>
      <button data-k="floating">메모</button>
      <button data-k="done">완료</button>
    </div>
    <span class="opt mg-n" id="mg-count"></span>
    <button class="x" type="button" data-close title="닫기" aria-label="닫기"><svg width="11" height="11" viewBox="0 0 11 11" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M1.6 1.6l7.8 7.8M9.4 1.6l-7.8 7.8"/></svg></button>
  </div>
  <div class="mg-list" id="mg-list"></div>
  <div class="btns"><button class="ghost" data-close>닫기</button></div>
</div>

<!-- ── 설정 ── -->
<div class="modal sheet" id="m-settings" role="dialog" aria-modal="true" aria-label="설정">
  <div class="f-head"><h3>설정</h3><button class="x" type="button" data-close title="닫기" aria-label="닫기"><svg width="11" height="11" viewBox="0 0 11 11" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M1.6 1.6l7.8 7.8M9.4 1.6l-7.8 7.8"/></svg></button></div>
  <!-- 두 갈래로 묶는다. 예전에는 성격이 다른 체크 세 개가 한 줄로 이어져,
       무엇이 알림 설정이고 무엇이 프로그램 설정인지 읽히지 않았다. -->
  <div class="s-cols">
  <div class="s-col">
  <span class="step">일정과 알림</span>
  <div class="row">
    <div><label for="s-lead">기본 알림 (분 전)</label><input id="s-lead" class="min5" type="number" min="0" step="5"></div>
    <div><label for="s-brief">아침 브리핑 시각</label><input id="s-brief" class="tf" data-tf data-req autocomplete="off" title="예: 930 · 21 · 930p"></div>
  </div>
  <label class="chk"><input type="checkbox" id="s-biz"> 영업일 기준으로만 쓰기 <i class="opt">주말 · 공휴일 자동 보정</i></label>
  <!-- Windows 가 알려주는 상태(SHQueryUserNotificationState)를 따른다. 전체 화면 ·
       발표 모드 · 방해 금지 · 잠금 화면이 여기 걸린다. 창을 띄워 둔 채 하는
       화면 공유는 Windows 가 알려주지 않으므로 잡지 못한다 - 이름을 그렇게 적었다. -->
  <label class="chk" title="전체 화면 · 발표 모드 · 화면 복제 · 방해 금지 · 잠금 화면일 때 미룹니다.&#10;창을 띄워 둔 채 하는 화면 공유는 Windows 가 알려주지 않아 잡지 못합니다."><input type="checkbox" id="s-hold"> 전체 화면 · 발표 중에는 알림을 미룸 <i class="opt">끝나면 묶어서 한 번</i></label>

  <span class="step">동기화 <i class="opt">PC · 휴대폰</i></span>
  <p class="hint sync-msg" id="sync-msg" aria-live="polite">—</p>
  <div class="quick">
    <button type="button" id="sync-now" hidden>지금 동기화</button>
    <button type="button" id="sync-btn" hidden>Google 계정으로 로그인</button>
  </div>
  <!-- 되돌릴 수 없는 단추는 자주 누르는 단추와 한 줄에 두지 않는다 -->
  <div class="quick far">
    <button type="button" class="danger" id="sync-del" hidden>계정 · 클라우드 데이터 삭제</button>
  </div>
  </div>
  <div class="vr"></div>
  <div class="s-col">

  <span class="step">화면</span>
  <!-- 이 앱의 색은 해 높이로 하루 종일 바뀐다. 그게 싫은 사람도 있고, 밤에
       일하는 사람은 한낮 색이 눈을 찌른다 - 한 자리에 세워 둘 수 있게 한다. -->
  <div class="seg" id="s-theme" role="group" aria-label="화면 밝기">
    <button type="button" data-v="auto">해를 따라</button>
    <button type="button" data-v="light">밝게</button>
    <button type="button" data-v="dark">어둡게</button>
  </div>
  <p class="hint">해를 따르면 아침 · 한낮 · 노을 · 밤이 저절로 건너갑니다.
    밝게는 한낮, 어둡게는 한밤의 빛으로 세워 둡니다.</p>

  <span class="step">프로그램</span>
  <label class="chk"><input type="checkbox" id="s-auto"> Windows 시작할 때 자동 실행</label>
  <!-- 둘 다 설치 직후 한 번 누르고 마는 것이라 나란히 둔다 -->
  <div class="quick">
    <button type="button" id="s-shortcut">바탕화면에 바로가기 만들기</button>
    <button type="button" id="s-test">알림 미리보기</button>
  </div>
  <p class="hint">저장 위치 <code>%APPDATA%\LazyScheduler\data.json</code></p>

  <span class="step">하늘</span>
  <label class="chk"><input type="checkbox" id="s-walk"> 돌멩이 움직임 <i class="opt">끄면 가운데에 가만히 앉아 눈만 굴립니다</i></label>
  </div>
  </div>
  <div class="btns split">
    <div><button class="ghost danger" id="s-quit">완전히 종료</button></div>
    <div>
      <span class="s-saved" id="s-saved" aria-live="polite"></span>
      <button class="ghost" data-close>닫기</button>
    </div>
  </div>
</div>

<!-- ── 확인 ── -->
<div class="modal narrow" id="m-confirm" role="alertdialog" aria-modal="true" aria-labelledby="cf-title">
  <h3 id="cf-title">확인</h3>
  <p class="hint" id="cf-msg"></p>
  <div id="cf-extra"></div>
  <div class="btns"><button class="ghost" data-close>취소</button><button class="danger-solid" id="cf-ok">삭제</button></div>
</div>

<script src="demo.js"></script>
<script src="app.js"></script>
<script src="sky.js"></script>
<script src="pebble.js"></script>
</body>
</html>
